[project]
name = "effi"
dynamic = ["version"]
description = "Effi reactor cycle analysis tools"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "plotly",
    "fastapi",
    "uvicorn[standard]",
    "openpyxl",
]

[project.optional-dependencies]
dev = ["jupyter", "pytest"]

[project.scripts]
effi-analysis = "backend.effi.cli:main"

[tool.setuptools.dynamic]
version = {attr = "backend.effi.__version__"}

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.effi" = ["_static/**/*"]
